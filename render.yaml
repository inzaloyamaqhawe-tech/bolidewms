# Render Blueprint - https://render.com/docs/blueprint-spec
# Deploy: New + -> Blueprint -> point at this repo -> Render reads this file.
# (Manual setup works too: Build "pip install -r requirements.txt",
# Start "gunicorn demo_server:app", Health check path "/health".)
services:
  - type: web
    name: bolide-wms
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn demo_server:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
